name: Notebook structure smoke test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip nbformat
      - run: python - <<'PY'
          import nbformat
          from pathlib import Path
          for p in Path('notebooks').glob('*.ipynb'):
              nbformat.read(p, as_version=4)
              print('ok', p)
          PY
